<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collage Maker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ── Header ── -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🖼</span>
      <span class="brand-name">Collage Maker</span>
    </div>
    <span id="previewStatus" class="render-badge" aria-live="polite"></span>
  </header>

  <!-- ── App shell: main + sidebar ── -->
  <div class="app-shell">

    <!-- LEFT: upload strip + canvas -->
    <div class="app-main">

      <!-- Image upload strip (also the global drop zone) -->
      <div class="upload-strip" id="dropZone" role="region"
           tabindex="0" aria-label="Image upload — drag photos here or use the slots below">
        <input type="file" id="fileInput" class="u-hidden-file"
               accept="image/jpeg,image/png,image/webp" multiple
               aria-label="Upload images" />

        <!-- Slot 1 -->
        <div class="img-slot" id="slot1">
          <div class="img-slot__header">
            <span class="slot-tag slot-tag--top">TOP</span>
            <button class="slot-clear" id="clearImg1" aria-label="Remove image 1" disabled>✕</button>
          </div>
          <div class="img-slot__body" id="preview1"
               role="button" tabindex="0" aria-label="Upload image 1">
            <span class="slot-plus" aria-hidden="true">＋</span>
            <span class="slot-hint">Add photo</span>
            <input type="file" id="fileInput1" class="slot-file-input"
                   accept="image/jpeg,image/png,image/webp" aria-label="Upload image 1" />
          </div>
        </div>

        <!-- Swap -->
        <button class="swap-btn" id="swapBtn" aria-label="Swap top and bottom images">⇅</button>

        <!-- Slot 2 -->
        <div class="img-slot" id="slot2">
          <div class="img-slot__header">
            <span class="slot-tag slot-tag--btm">BTM</span>
            <button class="slot-clear" id="clearImg2" aria-label="Remove image 2" disabled>✕</button>
          </div>
          <div class="img-slot__body" id="preview2"
               role="button" tabindex="0" aria-label="Upload image 2">
            <span class="slot-plus" aria-hidden="true">＋</span>
            <span class="slot-hint">Add photo</span>
            <input type="file" id="fileInput2" class="slot-file-input"
                   accept="image/jpeg,image/png,image/webp" aria-label="Upload image 2" />
          </div>
        </div>
      </div><!-- /upload-strip -->

      <!-- Canvas preview -->
      <div class="canvas-wrap" id="previewWrap">
        <canvas id="collageCanvas" class="collage-canvas" aria-label="Collage preview"></canvas>
        <div class="canvas-empty" id="previewPlaceholder">
          <span aria-hidden="true">🖼</span>
          <p>Add two photos to preview your collage</p>
        </div>
      </div>

    </div><!-- /app-main -->

    <!-- RIGHT: tabbed controls sidebar -->
    <aside class="app-sidebar">

      <!-- Tab navigation -->
      <nav class="tab-nav" role="tablist" aria-label="Customize settings">
        <button class="tab-btn is-active" role="tab" aria-selected="true"
                aria-controls="panel-layout" data-tab="layout">
          <span aria-hidden="true">📐</span><span>Layout</span>
        </button>
        <button class="tab-btn" role="tab" aria-selected="false"
                aria-controls="panel-style" data-tab="style">
          <span aria-hidden="true">✨</span><span>Style</span>
        </button>
        <button class="tab-btn" role="tab" aria-selected="false"
                aria-controls="panel-bg" data-tab="bg">
          <span aria-hidden="true">🌅</span><span>BG</span>
        </button>
        <button class="tab-btn" role="tab" aria-selected="false"
                aria-controls="panel-tpl" data-tab="tpl">
          <span aria-hidden="true">📋</span><span>Saved</span>
        </button>
      </nav>

      <!-- Scrollable tab panels -->
      <div class="tab-panels">

        <!-- Layout panel -->
        <div class="tab-panel is-active" id="panel-layout" role="tabpanel">

          <div class="ctrl-group">
            <label for="canvasPreset" class="ctrl-label">Canvas size</label>
            <select id="canvasPreset" class="form-select">
              <option value="1080x1350">Portrait  1080 × 1350</option>
              <option value="1080x1080">Square  1080 × 1080</option>
              <option value="1920x1080">Landscape  1920 × 1080</option>
              <option value="custom">Custom…</option>
            </select>
          </div>

          <div class="ctrl-group ctrl-group--row" id="customSizeRow" style="display:none">
            <div class="ctrl-group" style="flex:1">
              <label for="canvasWidth" class="ctrl-label">W (px)</label>
              <input type="number" id="canvasWidth" class="form-input" value="1080" min="100" max="8000" />
            </div>
            <div class="ctrl-group" style="flex:1">
              <label for="canvasHeight" class="ctrl-label">H (px)</label>
              <input type="number" id="canvasHeight" class="form-input" value="1350" min="100" max="8000" />
            </div>
            <label class="inline-check">
              <input type="checkbox" id="lockAspect" checked /><span>Lock</span>
            </label>
          </div>

          <div class="ctrl-group">
            <div class="ctrl-header">
              <label for="gapSize" class="ctrl-label">Gap between images</label>
              <span class="val-badge" id="gapSizeVal">20px</span>
            </div>
            <input type="range" id="gapSize" class="slider" min="0" max="80" value="20" />
          </div>

          <div class="ctrl-group">
            <div class="ctrl-header">
              <label for="margin" class="ctrl-label">Edge margin</label>
              <span class="val-badge" id="marginVal">40px</span>
            </div>
            <input type="range" id="margin" class="slider" min="0" max="120" value="40" />
          </div>

          <div class="ctrl-group">
            <label class="ctrl-label">Alignment</label>
            <div class="seg-ctrl" role="group" aria-label="Horizontal alignment">
              <button class="seg-btn" data-align="left" id="alignLeft" aria-pressed="false">Left</button>
              <button class="seg-btn is-active" data-align="center" id="alignCenter" aria-pressed="true">Center</button>
              <button class="seg-btn" data-align="right" id="alignRight" aria-pressed="false">Right</button>
            </div>
          </div>

        </div><!-- /panel-layout -->

        <!-- Style panel -->
        <div class="tab-panel" id="panel-style" role="tabpanel" hidden>

          <div class="ctrl-group">
            <div class="ctrl-header">
              <label for="cornerRadius" class="ctrl-label">Corner radius</label>
              <span class="val-badge" id="cornerRadiusVal">16px</span>
            </div>
            <input type="range" id="cornerRadius" class="slider" min="0" max="60" value="16" />
          </div>

          <div class="toggle-row">
            <span class="ctrl-label">Drop shadow</span>
            <label class="toggle-switch">
              <input type="checkbox" id="shadowEnabled" checked />
              <span class="toggle-switch__track"></span>
            </label>
          </div>

          <div id="shadowControls" class="shadow-sub">
            <div class="ctrl-group">
              <div class="ctrl-header">
                <label for="shadowBlur" class="ctrl-label">Blur</label>
                <span class="val-badge" id="shadowBlurVal">24px</span>
              </div>
              <input type="range" id="shadowBlur" class="slider" min="0" max="80" value="24" />
            </div>
            <div class="ctrl-group">
              <div class="ctrl-header">
                <label for="shadowOpacity" class="ctrl-label">Opacity</label>
                <span class="val-badge" id="shadowOpacityVal">60%</span>
              </div>
              <input type="range" id="shadowOpacity" class="slider" min="0" max="100" value="60" />
            </div>
            <div class="ctrl-group ctrl-group--inline">
              <label for="shadowColor" class="ctrl-label">Color</label>
              <input type="color" id="shadowColor" class="color-swatch" value="#000000" />
            </div>
            <div class="ctrl-group">
              <div class="ctrl-header">
                <label for="shadowOffsetX" class="ctrl-label">Offset X</label>
                <span class="val-badge" id="shadowOffsetXVal">0px</span>
              </div>
              <input type="range" id="shadowOffsetX" class="slider" min="-20" max="20" value="0" />
            </div>
            <div class="ctrl-group">
              <div class="ctrl-header">
                <label for="shadowOffsetY" class="ctrl-label">Offset Y</label>
                <span class="val-badge" id="shadowOffsetYVal">4px</span>
              </div>
              <input type="range" id="shadowOffsetY" class="slider" min="-20" max="20" value="4" />
            </div>
          </div>

        </div><!-- /panel-style -->

        <!-- Background panel -->
        <div class="tab-panel" id="panel-bg" role="tabpanel" hidden>

          <div class="ctrl-group">
            <label for="bgSource" class="ctrl-label">Background source</label>
            <select id="bgSource" class="form-select">
              <option value="image1">Image 1 (blurred)</option>
              <option value="image2">Image 2 (blurred)</option>
              <option value="color">Solid color</option>
              <option value="none">None / transparent</option>
            </select>
          </div>

          <div id="bgImageControls">
            <div class="ctrl-group">
              <div class="ctrl-header">
                <label for="bgBlur" class="ctrl-label">Blur</label>
                <span class="val-badge" id="bgBlurVal">20px</span>
              </div>
              <input type="range" id="bgBlur" class="slider" min="0" max="60" value="20" />
            </div>
            <div class="ctrl-group">
              <div class="ctrl-header">
                <label for="bgDarken" class="ctrl-label">Darken</label>
                <span class="val-badge" id="bgDarkenVal">30%</span>
              </div>
              <input type="range" id="bgDarken" class="slider" min="0" max="90" value="30" />
            </div>
          </div>

          <div id="bgColorControl" style="display:none">
            <div class="ctrl-group ctrl-group--inline">
              <label for="bgColor" class="ctrl-label">Color</label>
              <input type="color" id="bgColor" class="color-swatch" value="#1a1a2e" />
            </div>
          </div>

        </div><!-- /panel-bg -->

        <!-- Templates / Saved panel -->
        <div class="tab-panel" id="panel-tpl" role="tabpanel" hidden>

          <div id="templateList" class="tpl-list" role="list" aria-label="Saved templates"></div>

          <div class="tpl-save">
            <input type="text" id="templateName" class="form-input"
                   placeholder="Name your settings…" maxlength="40"
                   aria-label="Template name" />
            <button class="btn btn--secondary" id="saveTemplateBtn">Save</button>
          </div>

          <button class="btn btn--ghost btn--full" id="resetDefaultBtn">
            ↺ Reset to default settings
          </button>

        </div><!-- /panel-tpl -->

      </div><!-- /tab-panels -->

      <!-- Export dock — always visible at sidebar bottom -->
      <div class="export-dock">
        <div class="export-dock__row">
          <select id="exportFormat" class="form-select form-select--sm" aria-label="Export format">
            <option value="image/png">PNG</option>
            <option value="image/jpeg" selected>JPEG</option>
          </select>
          <select id="exportQuality" class="form-select form-select--sm" aria-label="Export quality">
            <option value="1">100%</option>
            <option value="0.9" selected>90%</option>
            <option value="0.75">75%</option>
            <option value="0.6">60%</option>
          </select>
        </div>
        <button class="btn btn--primary btn--full" id="downloadBtn" disabled>
          <span aria-hidden="true">⬇</span> Download Collage
        </button>
      </div>

    </aside><!-- /app-sidebar -->

  </div><!-- /app-shell -->

  <script src="js/collageRenderer.js"></script>
  <script src="js/templateManager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
